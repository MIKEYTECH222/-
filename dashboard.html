<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة مدارس الأحد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h2 class="text-xl font-bold">منصة خدمة مدارس الأحد</h2>
        <div class="flex items-center gap-4">
            <span id="user-badge" class="bg-indigo-700 px-3 py-1 rounded-full text-sm font-semibold">جاري التحميل...</span>
            <button onclick="logout()" class="bg-rose-500 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-rose-600 transition">خروج</button>
        </div>
    </header>

    <main class="p-6 max-w-5xl mx-auto w-full space-y-8 flex-1">
        <!-- قسم النقاط والمكافآت -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
                <h3 class="text-lg font-bold text-slate-700">رصيد النقاط والعملات الروحية</h3>
                <p class="text-3xl font-extrabold text-indigo-600 mt-1" id="user-points">0</p>
            </div>
            <div id="servant-controls" class="hidden">
                <button onclick="alert('خاصية تعديل نقاط الطلاب متاحة للخدام.')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-semibold hover:bg-emerald-700 transition text-sm">إدارة نقاط الطلاب</button>
            </div>
        </div>

        <!-- قسم أرشيف الدروس -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-700">📚 أرشيف الدروس والتلخيصات</h3>
                <button id="add-lesson-btn" onclick="openAddLessonModal()" class="hidden bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">إضافة درس جديد</button>
            </div>
            <div id="lessons-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- الدروس بتظهر هنا تلقائياً -->
            </div>
        </div>
    </main>

    <!-- نافذة إضافة درس جديد (للخدام فقط) -->
    <div id="lesson-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-md space-y-4">
            <h3 class="text-xl font-bold text-indigo-600">إضافة درس جديد للأرشيف</h3>
            <input type="text" id="lesson-title" placeholder="عنوان الدرس" class="w-full p-3 border rounded-xl outline-none">
            <textarea id="lesson-summary" placeholder="ملخص الدرس..." class="w-full p-3 border rounded-xl outline-none h-28"></textarea>
            <input type="date" id="lesson-date" class="w-full p-3 border rounded-xl outline-none">
            <div class="flex gap-2 justify-end">
                <button onclick="closeAddLessonModal()" class="bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold">إلغاء</button>
                <button onclick="saveLesson()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">حفظ ونشر</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
            } else {
                currentUser = session.user;
                loadUserData(currentUser.id);
                loadLessons();
            }
        }

        async function loadUserData(userId) {
            const { data } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            if (data) {
                document.getElementById('user-badge').innerText = `${data.full_name} (${data.role === 'servant' ? 'خادم' : 'مخدوم'})`;
                document.getElementById('user-points').innerText = data.points || 0;
                if (data.role === 'servant') {
                    document.getElementById('servant-controls').classList.remove('hidden');
                    document.getElementById('add-lesson-btn').classList.remove('hidden');
                }
            }
        }

        async function loadLessons() {
            const { data } = await _supabase.from('lessons').select('*').order('lesson_date', { ascending: false });
            const container = document.getElementById('lessons-list');
            container.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(lesson => {
                    container.innerHTML += `
                        <div class="p-4 border rounded-xl bg-slate-50 border-slate-100 flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-indigo-700">${lesson.title}</h4>
                                <p class="text-sm text-slate-600 mt-1">${lesson.summary || 'لا يوجد ملخص مضاف'}</p>
                            </div>
                            <span class="text-xs text-slate-400 mt-4 block">تاريخ الدرس: ${lesson.lesson_date}</span>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<p class="text-slate-400 text-sm col-span-2 text-center py-4">لا توجد دروس مضافة حتى الآن.</p>`;
            }
        }

        function openAddLessonModal() { document.getElementById('lesson-modal').classList.remove('hidden'); }
        function closeAddLessonModal() { document.getElementById('lesson-modal').classList.add('hidden'); }

        async function saveLesson() {
            const title = document.getElementById('lesson-title').value;
            const summary = document.getElementById('lesson-summary').value;
            const lessonDate = document.getElementById('lesson-date').value;

            if (!title || !lessonDate) return alert('الرجاء إدخال عنوان الدرس وتاريخه');

            const { error } = await _supabase.from('lessons').insert([{ title, summary, lesson_date: lessonDate, servant_id: currentUser.id }]);
            if (error) alert(error.message);
            else {
                alert('تم نشر الدرس بنجاح!');
                closeAddLessonModal();
                loadLessons();
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        checkSession();
    </script>
</body>
</html>
